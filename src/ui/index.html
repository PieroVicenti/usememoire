<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>usememoire</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
    header { padding: 24px 32px; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    header h1 span { color: #666; font-weight: 400; }
    .stats { display: flex; gap: 24px; font-size: 13px; color: #666; }
    .stats strong { color: #e0e0e0; }
    .container { max-width: 860px; margin: 0 auto; padding: 32px; }
    .search-bar { display: flex; gap: 12px; margin-bottom: 24px; }
    .search-bar input { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 10px 16px; color: #e0e0e0; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .search-bar input:focus { border-color: #444; }
    .search-bar input::placeholder { color: #555; }
    .workspace { font-size: 12px; color: #555; margin-bottom: 20px; font-family: monospace; }
    .memory-list { display: flex; flex-direction: column; gap: 8px; }
    .memory-item { background: #1a1a1a; border: 1px solid #222; border-radius: 8px; padding: 14px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; transition: border-color 0.2s; }
    .memory-item:hover { border-color: #333; }
    .memory-content { flex: 1; }
    .memory-fact { font-size: 14px; line-height: 1.5; color: #e0e0e0; }
    .memory-meta { display: flex; gap: 10px; margin-top: 6px; align-items: center; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
    .badge-pattern { background: #1a2a1a; color: #4caf50; }
    .badge-decision { background: #1a1a2a; color: #5c9eff; }
    .badge-preference { background: #2a1a2a; color: #c084fc; }
    .badge-file-ref { background: #2a2a1a; color: #f59e0b; }
    .badge-general { background: #222; color: #888; }
    .badge-source { background: #1e1e1e; color: #555; }
    .memory-date { font-size: 11px; color: #555; }
    .delete-btn { background: none; border: none; color: #444; cursor: pointer; padding: 4px; border-radius: 4px; transition: color 0.2s; font-size: 16px; line-height: 1; }
    .delete-btn:hover { color: #ef4444; }
    .empty { text-align: center; padding: 60px; color: #555; font-size: 14px; }
    .empty p { margin-top: 8px; font-size: 12px; color: #444; }
  </style>
</head>
<body>
  <header>
    <h1>usememoire <span>/ dashboard</span></h1>
    <div class="stats">
      <div>Memories: <strong id="total">0</strong></div>
    </div>
  </header>
  <div class="container">
    <div class="workspace" id="workspace">workspace: detecting...</div>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search memories..." />
    </div>
    <div class="memory-list" id="list"></div>
  </div>

  <script>
    let allMemories = [];
    let searchTimeout;

    async function load(query = '') {
      const url = query ? `/api/search?q=${encodeURIComponent(query)}` : '/api/memories';
      const res = await fetch(url);
      const data = await res.json();
      allMemories = data.memories || [];
      render(allMemories);
      document.getElementById('total').textContent = allMemories.length;
      if (data.workspace) {
        document.getElementById('workspace').textContent = 'workspace: ' + data.workspace;
      }
    }

    function render(memories) {
      const list = document.getElementById('list');
      if (!memories.length) {
        list.innerHTML = '<div class="empty"><div>No memories yet</div><p>Use [SAVE_MEMORY] in your chat to start saving context</p></div>';
        return;
      }
      list.innerHTML = memories.map(m => `
        <div class="memory-item" id="mem-${m.id}">
          <div class="memory-content">
            <div class="memory-fact">${escHtml(m.fact)}</div>
            <div class="memory-meta">
              <span class="badge badge-${m.category}">${m.category}</span>
              <span class="badge badge-source">${m.source}</span>
              <span class="memory-date">${formatDate(m.created_at)}</span>
            </div>
          </div>
          <button class="delete-btn" onclick="del(${m.id})" title="Delete">✕</button>
        </div>
      `).join('');
    }

    async function del(id) {
      await fetch(`/api/memories/${id}`, { method: 'DELETE' });
      load(document.getElementById('search').value);
    }

    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => load(e.target.value), 300);
    });

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatDate(dt) {
      const d = new Date(dt);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    }

    load();
  </script>
</body>
</html>
